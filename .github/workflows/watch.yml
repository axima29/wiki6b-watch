name: watch
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      drill:
        description: 'Учение: письмо [УЧЕНИЕ] на оба адреса'
        type: boolean
        default: false
permissions:
  issues: write
  contents: write
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: check
        env:
          WATCH_URL: ${{ secrets.WATCH_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRILL: ${{ inputs.drill }}
        run: python3 watch.py
      # GitHub выключает расписание публичного репозитория после 60 дней без коммитов: раз в 30 дней пустой коммит
      - name: keepalive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 2592000 ]; then
            git config user.name watch-bot && git config user.email watch-bot@users.noreply.github.com
            git commit --allow-empty -m "keepalive" && git push
          fi
